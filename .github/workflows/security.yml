name: Security

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Least-privilege default; jobs escalate individually when needed.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # === DEPENDENCY AUDITS ===
  # CodeQL and dependency-review only see *changed* dependencies on a pull
  # request; neither reports an advisory published against a lockfile entry
  # that nobody touched. These two jobs audit the committed lockfiles on every
  # push, pull request and weekly schedule (issue #168).
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-cargo-audit
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit@0.22.2

      - name: Audit committed Cargo.lock
        working-directory: rust
        run: cargo audit --file Cargo.lock

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-npm-audit
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      # --package-lock-only audits the committed tree without installing it, so
      # this stays fast and cannot be influenced by install scripts.
      - name: Audit committed package-lock.json
        working-directory: js
        run: npm audit --package-lock-only --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-codeql-${{ matrix.language }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions, rust]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Keeps archived third-party evidence under dev/log/ out of the
          # analysis; see the file for why (issue #168).
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-dependency-review
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The dependency graph is an owner-level setting. When it is off, the
      # review action fails with "Dependency review is not supported on this
      # repository", which is a configuration gap, not a vulnerability. Detect
      # it explicitly and warn loudly instead of either hiding the gate behind
      # continue-on-error or reporting a false vulnerability failure (#158).
      - name: Check whether the dependency graph is enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          status=$(gh api \
            "repos/${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            --silent -i 2>/dev/null | head -n 1 | awk '{print $2}' || true)
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency review skipped: the dependency graph is \
            disabled for ${{ github.repository }} (API returned ${status:-error}). \
            Enable it under Settings > Code security to activate this gate."
          fi

      - name: Review dependency changes
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # === SECRETS SCAN ===
  # Language-agnostic credential scan; runs via npx so no Node dependency is
  # committed. Best practice #11 of docs/CI-CD-BEST-PRACTICES.md.
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-secrets-scan
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run secretlint
        run: npx --yes -p secretlint -p @secretlint/secretlint-rule-preset-recommend secretlint --secretlintignore .gitignore "**/*"

  # === PIPELINE STATUS ===
  pipeline-status:
    name: Pipeline Status
    needs: [cargo-audit, npm-audit, codeql, dependency-review, secrets-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: bash scripts/check-pipeline-status.sh
