[package]
name = "start-command"
version = "0.30.0"
edition = "2021"
authors = ["Link Foundation"]
description = "Gamification of coding, execute any command with ability to auto-report issues on GitHub"
license = "Unlicense"
repository = "https://github.com/link-foundation/start"
homepage = "https://github.com/link-foundation/start#readme"
keywords = ["cli", "command", "gamification", "github", "automation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "start"
path = "src/bin/main.rs"

[lib]
name = "start_command"
path = "src/lib/mod.rs"

[dependencies]
chrono = "0.4.45"
dirs = "7.0.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4"] }
lino-objects-codec = "0.9.2"
sha2 = "0.11.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"

# Keep each compiler process small; CI also disables incremental artifacts.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
